name: Publicar na HostGator (lottopag.com)

# Envia o site para a hospedagem por FTPS a cada push na main.
# Requer os segredos FTP_SERVER, FTP_USERNAME e FTP_PASSWORD
# (Settings → Secrets and variables → Actions → Secrets). Sem eles, o workflow é ignorado.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Segredos de FTP não configurados; nada a publicar."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.ready == 'true'

      - name: Build estático para a raiz do domínio
        if: steps.check.outputs.ready == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: ${{ vars.HOSTGATOR_SITE_URL || 'https://lottopag.com' }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          COMMERCIAL_EMAIL: ${{ vars.COMMERCIAL_EMAIL }}
          COMMERCIAL_PHONE: ${{ vars.COMMERCIAL_PHONE }}

      - name: Incluir .htaccess
        if: steps.check.outputs.ready == 'true'
        run: cp deploy/htaccess-hostgator out/.htaccess

      - name: Enviar por FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
